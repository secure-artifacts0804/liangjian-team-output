name: Verified release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $rootVersion = node -p "require('./package.json').version"
          $desktopVersion = node -p "require('./desktop/package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$rootVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match root version v$rootVersion"
          }
          if ($desktopVersion -ne $rootVersion) {
            throw "Desktop version $desktopVersion does not match root version $rootVersion"
          }

      - name: Install locked web dependencies
        run: npm ci --ignore-scripts

      - name: Install locked desktop dependencies
        run: npm --prefix desktop ci

      - name: Web dependency security gate
        run: npm audit --audit-level=high

      - name: Desktop dependency security gate
        run: npm --prefix desktop audit --audit-level=high

      - name: Build and test web application
        run: npm test

      - name: Test desktop security configuration
        run: npm --prefix desktop run test

      - name: Build Windows desktop software
        run: npm --prefix desktop run make

      - name: Verify packaged desktop starts
        shell: pwsh
        run: |
          $appDir = Resolve-Path "desktop/out/LiangJian-win32-x64"
          $exe = Join-Path $appDir "LiangJian.exe"
          $debugLog = Join-Path $appDir "debug.log"
          Remove-Item $debugLog -Force -ErrorAction SilentlyContinue

          $env:LIANGJIAN_SMOKE_TEST = "1"
          $process = Start-Process `
            -FilePath $exe `
            -WorkingDirectory $appDir `
            -PassThru
          if (-not $process.WaitForExit(45000)) {
            Get-Process LiangJian -ErrorAction SilentlyContinue |
              Stop-Process -Force
            throw "Packaged desktop did not reach ready-to-show within 45 seconds"
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $debugLog) { Get-Content $debugLog }
            throw "Packaged desktop exited with code $($process.ExitCode)"
          }

      - name: Package exact build and source adapter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/source | Out-Null
          Copy-Item -Recurse dist, google-apps-script release/source/
          Copy-Item README.md release/source/

          $desktopZip = Get-ChildItem desktop/out/*windows-x64.zip |
            Select-Object -First 1
          if (-not $desktopZip) {
            throw "Windows desktop archive was not produced"
          }

          $desktopAsset = "LiangJian-$env:GITHUB_REF_NAME-windows-x64.zip"
          Copy-Item $desktopZip.FullName $desktopAsset
          $sourceZip = "liangjian-$env:GITHUB_REF_NAME-source.zip"
          Compress-Archive -Path release/source/* -DestinationPath $sourceZip

          npm sbom --sbom-format spdx | Out-File `
            -Encoding utf8 release/Web-SBOM.spdx.json
          npm --prefix desktop sbom --sbom-format spdx | Out-File `
            -Encoding utf8 release/Desktop-SBOM.spdx.json

          $lines = @($desktopAsset, $sourceZip) | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $_"
          }
          Set-Content -Encoding ascii SHA256SUMS $lines

      - name: Install verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Sign packages with the GitHub Actions OIDC identity
        shell: pwsh
        run: |
          cosign sign-blob --yes `
            --bundle "LiangJian-$env:GITHUB_REF_NAME-windows-x64.sigstore.json" `
            "LiangJian-$env:GITHUB_REF_NAME-windows-x64.zip"
          cosign sign-blob --yes `
            --bundle "liangjian-$env:GITHUB_REF_NAME-source.sigstore.json" `
            "liangjian-$env:GITHUB_REF_NAME-source.zip"

      - name: Attest release artifacts for gh verification
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            LiangJian-${{ github.ref_name }}-windows-x64.zip
            LiangJian-${{ github.ref_name }}-windows-x64.sigstore.json
            liangjian-${{ github.ref_name }}-source.zip
            liangjian-${{ github.ref_name }}-source.sigstore.json
            SHA256SUMS
            release/Web-SBOM.spdx.json
            release/Desktop-SBOM.spdx.json

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(
            "LiangJian-$env:GITHUB_REF_NAME-windows-x64.zip",
            "LiangJian-$env:GITHUB_REF_NAME-windows-x64.sigstore.json",
            "liangjian-$env:GITHUB_REF_NAME-source.zip",
            "liangjian-$env:GITHUB_REF_NAME-source.sigstore.json",
            "SHA256SUMS",
            "release/Web-SBOM.spdx.json",
            "release/Desktop-SBOM.spdx.json"
          )

          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets `
              --verify-tag `
              --generate-notes `
              --title "量见 $env:GITHUB_REF_NAME"
          }
