name: Verified release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$VERSION"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Security gate
        run: npm audit --audit-level=high

      - name: Build and test
        run: npm test

      - name: Package exact build and source adapter
        shell: bash
        run: |
          mkdir -p release
          cp -R dist google-apps-script README.md release/
          npm sbom --sbom-format spdx > release/SBOM.spdx.json
          zip -r "liangjian-${GITHUB_REF_NAME}.zip" release
          sha256sum "liangjian-${GITHUB_REF_NAME}.zip" > SHA256SUMS

      - name: Install verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Sign package with the GitHub Actions OIDC identity
        shell: bash
        run: |
          cosign sign-blob --yes \
            --bundle "liangjian-${GITHUB_REF_NAME}.sigstore.json" \
            "liangjian-${GITHUB_REF_NAME}.zip"

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "liangjian-${GITHUB_REF_NAME}.zip" \
              "liangjian-${GITHUB_REF_NAME}.sigstore.json" \
              SHA256SUMS \
              release/SBOM.spdx.json \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "liangjian-${GITHUB_REF_NAME}.zip" \
              "liangjian-${GITHUB_REF_NAME}.sigstore.json" \
              SHA256SUMS \
              release/SBOM.spdx.json \
              --verify-tag \
              --generate-notes \
              --title "量见 ${GITHUB_REF_NAME}"
          fi
